[package]
name = "symvoulio"
version.workspace = true
description = "Multi-provider document review with human approval"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "symvoulio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[[bin]]
name = "symvoulio"
path = "src/main.rs"
test = false

[[test]]
name = "command_layer"
path = "src/command_tests.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symvoulio-core = { path = "../crates/symvoulio-core" }
portable-pty = "0.9"
tempfile = "3"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Property tests for the paste and keystroke filters.
proptest = "1"

[target.'cfg(windows)'.dev-dependencies]
winreg = "0.55"
